[platformio]
; To switch between upload methods, change the value below to either:
; default_envs = esp32_cyd_serial  (for USB cable upload)
; default_envs = esp32_cyd_ota      (for network upload)
default_envs = esp32_cyd_serial


[env]
; Common settings for all environments
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Enter your actual password in the line below.
; For example: custom_ota_password = my_secret_password_123
custom_ota_password = esp32-ota-123
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags = 
    -D OTA_UPDATE_PASSWORD="\"${env.custom_ota_password}\""
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D TOUCH_CS=33

[env:esp32_cyd_serial]
upload_protocol = esptool
upload_speed = 921600

[env:esp32_cyd_ota]
extra_scripts = extra_script.py
upload_protocol = espota
upload_port = esp32-weather.local
upload_flags = --auth=${env.custom_ota_password}
